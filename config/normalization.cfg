# Integrated luminosity of the CMS 2016 G+H data used in this project.
# Cross sections are in pb, therefore luminosity is expressed in pb^-1.
luminosity_pb=16146.0

# Effective cross sections of the simulated final states.
# TTToSemiLeptonic already includes the semileptonic ttbar branching fraction.
ttbar_semileptonic_xsec_pb=365.34

# Probability that a ttbar pair decays semileptonically (one W hadronic and
# the other W leptonic, including e, mu and tau). This is entered directly and
# is not obtained by dividing two cross sections.
ttbar_semileptonic_br=0.439

# Theory value used only as a final comparison, never in the measurement.
ttbar_inclusive_reference_pb=831.76

# DYJetsToLL_M-50 already includes the Z/gamma* -> ll decay requirement.
dyjets_xsec_pb=6077.22

# Values supplied by the professor. They already include W -> l nu.
w0j_xsec_pb=50131.98
w1j_xsec_pb=8426.09
w2j_xsec_pb=3172.96

# Explicit convention: no additional branching-ratio multiplier is applied.
branching_factor=1.0
